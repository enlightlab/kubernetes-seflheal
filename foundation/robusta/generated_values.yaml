# Credentials are loaded from the robusta-secrets Kubernetes Secret via additional_env_froms. Apply the secret manifest first, then install with this file.

clusterName: enlight-lab-kind # NOTE - adjust the clusterName when adding additional clusters
globalConfig:
  signing_key: "{{ env.SIGNING_KEY }}"
  account_id: e92b5885-526e-4805-9172-a07e0811efba
sinksConfig:
  - robusta_sink:
      name: robusta_ui_sink
      token: "{{ env.ROBUSTA_UI_TOKEN }}"
enablePrometheusStack: false
enablePlatformPlaybooks: true
runner:
  sendAdditionalTelemetry: true
  additional_env_froms:
    - secretRef:
        name: robusta-secrets
  resources:
    requests:
      memory: 1Gi
      cpu: 100m
    limits:
      memory: 1536Mi
enableHolmesGPT: true
enabledManagedConfiguration: true
holmes:
  additionalEnvVars:
    - name: ROBUSTA_AI
      value: "true"
    - name: ROBUSTA_UI_TOKEN
      valueFrom:
        secretKeyRef:
          name: robusta-secrets
          key: ROBUSTA_UI_TOKEN
  additional_env_froms:
    - secretRef:
        name: robusta-secrets
  resources:
    requests:
      memory: 1Gi
      cpu: 100m
    limits:
      memory: 1Gi
kubewatch:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 128Mi
