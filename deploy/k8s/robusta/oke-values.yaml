# Robusta + HolmesGPT on Oracle OKE (Mumbai / AP region).
# Apply robusta-secrets first, then: helm upgrade --install robusta robusta/robusta -f oke-values.yaml -n robusta
#
# Tokens from https://platform.robusta.dev → Install / Verify (same as local kind demo).

clusterName: enlight-oke-mumbai

globalConfig:
  signing_key: "{{ env.SIGNING_KEY }}"
  account_id: "e92b5885-526e-4805-9172-a07e0811efba"

sinksConfig:
  - robusta_sink:
      name: robusta_ui_sink
      token: "{{ env.ROBUSTA_UI_TOKEN }}"

enablePrometheusStack: false
enablePlatformPlaybooks: true
enabledManagedConfiguration: true
enableHolmesGPT: true

runner:
  sendAdditionalTelemetry: true
  additional_env_froms:
    - secretRef:
        name: robusta-secrets
  resources:
    requests:
      memory: 1Gi
      cpu: 100m
    limits:
      memory: 1536Mi

holmes:
  additionalEnvVars:
    - name: ROBUSTA_AI
      value: "true"
    - name: ROBUSTA_API_ENDPOINT
      value: "https://api.ap.robusta.dev"
    - name: ROBUSTA_UI_TOKEN
      valueFrom:
        secretKeyRef:
          name: robusta-secrets
          key: ROBUSTA_UI_TOKEN
  additional_env_froms:
    - secretRef:
        name: robusta-secrets
  resources:
    requests:
      memory: 1Gi
      cpu: 200m
    limits:
      memory: 2Gi
  modelList:
    robusta:
      model: robusta

kubewatch:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
