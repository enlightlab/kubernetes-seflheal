# Copy to robusta-secrets.yaml and fill from platform.robusta.dev (Install step).
# NEVER commit the real file.
apiVersion: v1
kind: Secret
metadata:
  name: robusta-secrets
  namespace: robusta
type: Opaque
stringData:
  SIGNING_KEY: "your-signing-key-uuid"
  ROBUSTA_UI_TOKEN: "your-base64-robusta-ui-token"
  ROBUSTA_ACCOUNT_ID: "your-account-id-uuid"
