# Argo CD UI via nginx Ingress (same controller as selfheal.enlightlab.com).
# Prerequisites:
#   1. DNS A record: argocd.enlightlab.com -> nginx Ingress IP (e.g. 144.24.100.85)
#   2. Run deploy/oci/setup-argocd-ingress.sh (sets server.insecure + TLS + demo links)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - argocd.enlightlab.com
      secretName: argocd-enlightlab-tls
  rules:
    - host: argocd.enlightlab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
