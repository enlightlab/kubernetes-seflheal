apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-staging
  namespace: argocd
spec:
  project: default
  source:
    # Same public repo as fastapi-staging — push deploy/k8s/staging-nginx to this path in enlight-lab-platform
    repoURL: https://github.com/kirtiprasad2003/enlight-lab-platform.git
    targetRevision: main
    path: demos/nginx-staging/overlays/oci
  destination:
    server: https://kubernetes.default.svc
    namespace: enlight-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: nginx-demo
      jsonPointers:
        - /spec/template/spec/containers/0/image
    - kind: Service
      name: nginx-demo
      jsonPointers:
        - /spec/clusterIP
