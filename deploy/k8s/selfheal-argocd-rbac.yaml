# Lets selfheal-ui read demo Argo CD password secrets (display on /demo sidebar).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: selfheal-ui-secrets
  namespace: selfheal
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-demo-login"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: selfheal-ui-secrets
  namespace: selfheal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: selfheal-ui-secrets
subjects:
  - kind: ServiceAccount
    name: selfheal-ui
    namespace: selfheal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: selfheal-ui-argocd-read
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-initial-admin-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: selfheal-ui-argocd-read
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: selfheal-ui-argocd-read
subjects:
  - kind: ServiceAccount
    name: selfheal-ui
    namespace: selfheal
