apiVersion: v1
kind: ConfigMap
metadata:
  name: {{SERVICE_NAME}}-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: {{SERVICE_NAME}}
data:
  {{SERVICE_NAME}}-overview.json: |
    {
      "title": "{{SERVICE_NAME}} Overview",
      "uid": "{{SERVICE_NAME}}-overview",
      "tags": ["enlight-lab", "{{SERVICE_NAME}}"],
      "timezone": "browser",
      "panels": [
        {
          "title": "Pod CPU",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "rate(container_cpu_usage_seconds_total{pod=~\"{{SERVICE_NAME}}.*\"}[5m])"}]
        },
        {
          "title": "Pod Memory",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "container_memory_working_set_bytes{pod=~\"{{SERVICE_NAME}}.*\"}"}]
        },
        {
          "title": "Health Check",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 8},
          "targets": [{"expr": "up{job=\"{{SERVICE_NAME}}\"}"}]
        }
      ],
      "schemaVersion": 38,
      "version": 1
    }
