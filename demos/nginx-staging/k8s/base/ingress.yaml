# 1. Create a Traefik middleware to strip the /nginx prefix
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: nginx-stripprefix
  namespace: enlight-staging
spec:
  stripPrefix:
    prefixes:
      - /nginx

---
# 2. Apply the ingress using the Traefik class and the new middleware
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-demo
  namespace: enlight-staging
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: enlight-staging-nginx-stripprefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /nginx
            pathType: Prefix
            backend:
              service:
                name: nginx-demo
                port:
                  number: 80
